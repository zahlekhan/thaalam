<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#000;color:#fff;font-family:'Open Sans',sans-serif;position:relative}
.big{position:absolute;top:10px;left:14px;font-weight:300;font-size:92px;letter-spacing:-4px;white-space:nowrap;line-height:1}
.st{position:absolute;top:118px;left:18px;font-size:15px;color:#00ABEC}
.t{position:absolute;width:150px;height:150px;overflow:hidden}
.t .ph{position:absolute;inset:0}
.t .w{position:absolute;left:8px;bottom:6px;font-weight:300;font-size:26px;letter-spacing:-1px}
.sel{outline:6px solid #FF0097}
.mu{opacity:.35}
.bar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;gap:2px;padding:0 0 12px}
.bar div{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
</style></head><body>
<div class="big">thaalam music</div>
<div class="st">4 playing · 104 BPM · upbeat</div>
<div class="t" style="left:18px;top:160px"><div class="ph" style="background:linear-gradient(160deg,#f6c26b,#c4581f 60%,#5b2410)"></div><div class="w">kick</div></div>
<div class="t" style="left:186px;top:180px;background:#00ABEC"><div class="ph" style="background:linear-gradient(200deg,#ff5fa2,#ffd23f 45%,#2ec4b6);mix-blend-mode:multiply"></div><div class="w">hi-hats</div></div>
<div class="t sel" style="left:70px;top:350px"><div class="ph" style="background:linear-gradient(180deg,#1b2a52,#3a6fb0 55%,#9fc4e8)"></div><div class="w">bass</div></div>
<div class="t mu" style="left:226px;top:380px"><div class="ph" style="background:linear-gradient(170deg,#2d6a4f,#74c69d 60%,#d8f3dc)"></div><div class="w">keys</div></div>
<div class="t" style="left:30px;top:540px;background:#8CBF26"><div class="ph" style="background:linear-gradient(150deg,#ffb703,#fb8500 50%,#3d1d00);mix-blend-mode:multiply"></div><div class="w">bells</div></div>
<div style="position:absolute;left:200px;top:580px;background:#FF0097;padding:12px 16px;font-size:15px;font-weight:600">mute &nbsp; delete</div>
<div class="bar"><div style="background:#FF0097">stop</div><div style="background:#222">add photo</div><div style="background:#00ABEC">invite</div></div>
</body></html>
