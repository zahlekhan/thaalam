<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#141414;background:#FF4FA3;position:relative}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.25),transparent 50%)}
.top{position:absolute;top:18px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:28px;color:#FFE14D;letter-spacing:-1px}
.chip{background:#141414;color:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
.print{position:absolute;width:150px;background:#fff;padding:9px 9px 34px;box-shadow:0 10px 18px rgba(80,0,40,.35)}
.ph{height:132px}
.hw{position:absolute;bottom:6px;left:10px;font-family:Caveat,cursive;font-size:20px}
.play .ph{box-shadow:0 0 0 4px #FFE14D}
.mute{opacity:.55;filter:grayscale(1)}
.bar{position:absolute;left:12px;right:12px;bottom:18px;height:70px;background:#141414;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 10px}
.pl{width:54px;height:54px;border-radius:50%;background:#FFE14D;display:flex;align-items:center;justify-content:center;font-size:20px}
.b{flex:1;height:50px;border-radius:14px;background:#2a2a2a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.b.i{background:#2B2BFF}
</style></head><body>
<div class="top"><div class="brand">Thaalam</div><div class="chip">4 playing · 104 BPM</div></div>
<div class="print play" style="left:18px;top:96px;transform:rotate(-9deg)"><div class="ph" style="background:linear-gradient(160deg,#f6c26b,#c4581f 60%,#5b2410)"></div><div class="hw">kick · chai</div></div>
<div class="print play" style="left:196px;top:120px;transform:rotate(7deg)"><div class="ph" style="background:linear-gradient(200deg,#ff5fa2,#ffd23f 45%,#2ec4b6)"></div><div class="hw">hi-hats · crowd</div></div>
<div class="print play" style="left:96px;top:312px;transform:rotate(-3deg)"><div class="ph" style="background:linear-gradient(180deg,#1b2a52,#3a6fb0 55%,#9fc4e8)"></div><div class="hw">bass · rain</div></div>
<div class="print mute" style="left:10px;top:500px;transform:rotate(11deg)"><div class="ph" style="background:linear-gradient(170deg,#2d6a4f,#74c69d 60%,#d8f3dc)"></div><div class="hw">keys · muted</div></div>
<div class="print play" style="left:212px;top:486px;transform:rotate(-12deg)"><div class="ph" style="background:linear-gradient(150deg,#ffb703,#fb8500 50%,#3d1d00)"></div><div class="hw">bells · lamps</div></div>
<div class="bar"><div class="pl">■</div><div class="b">+ Add photo</div><div class="b i">Invite</div></div>
</body></html>
