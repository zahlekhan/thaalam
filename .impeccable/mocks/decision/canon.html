<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#111;font-family:Nunito,sans-serif;position:relative}
.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:24px}
.chip{background:#F3F4F6;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.c{position:absolute;width:140px;border-radius:20px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);background:#fff}
.ph{height:110px}
.r{padding:8px 10px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%}
.m{opacity:.45}
.play{position:absolute;left:50%;bottom:28px;margin-left:-38px;width:76px;height:76px;border-radius:50%;background:#FF5A5F;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}
.side{position:absolute;bottom:42px;width:54px;height:54px;border-radius:50%;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
</style></head><body>
<div class="top"><div class="brand">Thaalam</div><div class="chip">4 playing · 104 BPM</div></div>
<div class="c" style="left:24px;top:90px"><div class="ph" style="background:linear-gradient(160deg,#f6c26b,#c4581f 60%,#5b2410)"></div><div class="r"><span class="dot" style="background:#FF5A5F"></span>Kick</div></div>
<div class="c" style="left:210px;top:120px"><div class="ph" style="background:linear-gradient(200deg,#ff5fa2,#ffd23f 45%,#2ec4b6)"></div><div class="r"><span class="dot" style="background:#FFD43B"></span>Hi-hats</div></div>
<div class="c" style="left:110px;top:300px"><div class="ph" style="background:linear-gradient(180deg,#1b2a52,#3a6fb0 55%,#9fc4e8)"></div><div class="r"><span class="dot" style="background:#4C6EF5"></span>Bass</div></div>
<div class="c m" style="left:20px;top:480px"><div class="ph" style="background:linear-gradient(170deg,#2d6a4f,#74c69d 60%,#d8f3dc)"></div><div class="r">Keys · muted</div></div>
<div class="c" style="left:220px;top:470px"><div class="ph" style="background:linear-gradient(150deg,#ffb703,#fb8500 50%,#3d1d00)"></div><div class="r"><span class="dot" style="background:#9B5DE5"></span>Bells</div></div>
<div class="side" style="left:60px">+</div><div class="play">■</div><div class="side" style="right:60px">⇪</div>
</body></html>
