# Deploy: cd server && fly deploy
# Secrets: fly secrets set TYPESAFE_API_KEY=... ALLOWED_ORIGINS=https://<frontend-host>
app = "thaalam-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
